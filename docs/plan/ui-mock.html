<title>Journey Recorder UI mock</title>
<!-- Structural mock for review (docs/spec/ui-ux.md §9). Not product code: delete after acceptance. -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1b1d21; --muted: #5a616c; --line: #d6d9de; --soft: #f2f3f5;
    --accent: #1a56b8; --rec: #b3261e; --warn: #7a4f00; --warn-bg: #fff3d1; --ok: #1b6e35;
    --err: #b3261e; --err-bg: #fde7e6; --match: #e3edfc; --page: #e6e8ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1f23; --fg: #e8eaed; --muted: #a8aeb8; --line: #3b3f46; --soft: #272a2f;
      --accent: #8ab4f8; --rec: #f28b82; --warn: #fdd663; --warn-bg: #3b3218; --ok: #81c995;
      --err: #f28b82; --err-bg: #3d2220; --match: #1f2f46; --page: #121316;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button.link { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .muted { color: var(--muted); }

  .mockbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--soft); border-bottom: 1px solid var(--line); }
  .mockbar p { margin: 0; flex-basis: 100%; color: var(--muted); }
  .stage { padding: 16px; display: flex; justify-content: center; }

  .frame { width: var(--w, 360px); height: 700px; max-width: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .hdr { padding: 8px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .status-line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .status { font-weight: 600; }
  .status.recording { color: var(--rec); }
  .session-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .controls .counts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .warnbtn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .banner { padding: 6px 8px; border-radius: 4px; display: grid; gap: 4px; }
  .banner.error { background: var(--err-bg); color: var(--err); }
  .banner.prompt { background: var(--soft); border: 1px dashed var(--line); }
  .banner .actions { display: flex; gap: 6px; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs [role="tab"], .tabs .gear { flex: 1; border: 0; border-radius: 0; background: none; padding: 7px 4px; border-bottom: 2px solid transparent; }
  .tabs .gear { flex: 0 0 36px; }
  .tabs [aria-selected="true"], .tabs .gear[aria-pressed="true"] { border-bottom-color: var(--accent); font-weight: 600; }

  main { flex: 1; overflow: auto; position: relative; }
  .view { padding: 8px 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .toolbar .grow { flex: 1 1 120px; min-width: 0; }
  .toolbar .info { flex-basis: 100%; display: flex; justify-content: space-between; color: var(--muted); }

  ol.list { list-style: none; margin: 0; padding: 0; }
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 6px 10px; }
  .row:hover { background: var(--soft); }
  .row.match { background: var(--match); }
  .row .meta { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; color: var(--muted); }
  .row .title { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .row .evs { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; font-size: 11px; color: var(--fg); }
  .pstat { color: var(--warn); font-weight: 600; }
  .pstat.failed { color: var(--err); }
  .delta { margin-left: auto; font-variant-numeric: tabular-nums; }
  .sep { padding: 4px 10px; background: var(--soft); border-bottom: 1px solid var(--line); color: var(--muted); overflow-wrap: anywhere; }
  .gap { padding: 4px 10px; border-bottom: 1px solid var(--line); color: var(--warn); background: var(--warn-bg); }
  .group-h { margin: 0; padding: 6px 10px; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--fg); border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .jump { position: sticky; bottom: 8px; left: 100%; margin: 8px; float: right; }
  .empty { padding: 24px 16px; color: var(--muted); display: grid; gap: 8px; }
  .empty strong { color: var(--fg); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg label { padding: 2px 8px; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; }
  .seg input:checked + span { font-weight: 600; text-decoration: underline; }
  .seg label:focus-within { outline: 2px solid var(--accent); }

  .inspector { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .inspector[hidden] { display: none; }
  .insp-head { padding: 6px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
  .insp-nav { display: flex; gap: 6px; align-items: center; }
  .insp-nav h2 { font-size: 13px; margin: 0 0 0 auto; }
  .insp-body { flex: 1; overflow: auto; padding: 8px 10px; }
  .subtabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 0 6px; }
  .subtabs [role="tab"] { border: 0; border-radius: 0; background: none; padding: 5px 6px; border-bottom: 2px solid transparent; }
  .subtabs [aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 600; }
  dl.kv { display: grid; grid-template-columns: minmax(80px, 34%) 1fr; gap: 3px 8px; margin: 0; }
  dl.kv dt { color: var(--muted); overflow-wrap: anywhere; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 12px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  pre { margin: 0; padding: 6px; background: var(--soft); border-radius: 4px; overflow-x: auto; white-space: pre; max-height: 360px; }
  pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ref { color: var(--muted); }
  .unresolved { color: var(--warn); }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; display: grid; gap: 4px; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .notice { padding: 6px 8px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); margin-bottom: 8px; }
  .notice.failed { background: var(--err-bg); color: var(--err); }
  .notice ul { margin: 2px 0 0; padding-left: 18px; }

  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { border-bottom: 1px solid var(--line); padding: 6px 0; display: grid; gap: 2px; }
  .st { font-weight: 600; }
  .st.reached { color: var(--ok); } .st.missing { color: var(--err); } .st.out_of_order { color: var(--warn); } .st.pending { color: var(--muted); }
  .editor-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .editor-row .full { grid-column: 1 / -1; }
  .field { display: grid; gap: 2px; margin-bottom: 10px; }
  .field small { color: var(--muted); }
  .field .error { color: var(--err); }
  textarea { width: 100%; min-height: 64px; }
  .toast { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 6px 8px; border-radius: 4px; background: var(--fg); color: var(--bg); }
  .toast[hidden] { display: none; }
  dialog { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); max-width: 320px; }
  dialog::backdrop { background: rgb(0 0 0 / 40%); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
</style>
</head>
<body>
<div class="mockbar">
  <strong>UI mock</strong>
  <label>Scenario
    <select id="scenario">
      <option value="recording">Recording with hits</option>
      <option value="paused">Paused</option>
      <option value="stopped">Stopped, viewing session</option>
      <option value="nohits">Recording, no hits yet</option>
      <option value="idle">First use: not recording, no sessions</option>
      <option value="storage">Error: storage full</option>
      <option value="capture">Error: capture failure</option>
    </select>
  </label>
  <label>Panel width
    <select id="width"><option>320</option><option selected>360</option><option>500</option></select>
  </label>
  <button type="button" id="simulate">Simulate new hit</button>
  <p>Structure and interaction only. Fixtures: two real reference hits (db.jobs AppMeasurement GET, aida.de Web SDK POST), the others are derived variants. Decoding runs live in this page. Keys: ↑/↓ in lists, Enter opens, Esc closes, j/k prev/next in inspector, arrows in tab bars.</p>
</div>

<div class="stage">
  <div class="frame" id="panel">
    <header class="hdr" id="hdr"></header>
    <nav class="tabs" role="tablist" aria-label="Views" id="tabs">
      <button type="button" role="tab" id="tab-live" aria-controls="views" data-view="live">Live</button>
      <button type="button" role="tab" id="tab-journey" aria-controls="views" data-view="journey">Journey</button>
      <button type="button" role="tab" id="tab-funnel" aria-controls="views" data-view="funnel">Funnel</button>
      <button type="button" role="tab" id="tab-sessions" aria-controls="views" data-view="sessions">Sessions</button>
      <button type="button" class="gear" id="gear" aria-label="Settings" aria-pressed="false">⚙</button>
    </nav>
    <main id="views" role="tabpanel"></main>
    <section class="inspector" id="inspector" hidden aria-labelledby="insp-title"></section>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="sr-only" id="announce" aria-live="polite"></div>
  </div>
</div>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div class="actions">
    <button type="button" id="confirm-cancel">Cancel</button>
    <button type="button" id="confirm-ok" class="primary">Delete</button>
  </div>
</dialog>

  const fields = ['event', 'page_name', 'page_url', 'hit_type', 'source', 'rsid', 'tab', 'evar:1', 'prop:1'];
  const ops = ['equals', 'contains', 'exists'];
  const rows = f.steps.map((s, i) => h('div', { class: 'editor-row', role: 'group', 'aria-label': `Step ${i + 1}` },
    h('input', { class: 'full', 'aria-label': `Step ${i + 1} name`, value: s.name, oninput: (e) => { s.name = e.target.value; } }),
    h('select', { 'aria-label': `Step ${i + 1} field`, onchange: (e) => { s.rule.field = e.target.value; } }, fields.map((x) => h('option', { selected: x === s.rule.field }, x))),
    h('select', { 'aria-label': `Step ${i + 1} operator`, onchange: (e) => { s.rule.op = e.target.value; } }, ops.map((x) => h('option', { selected: x === s.rule.op }, x))),
    h('input', { 'aria-label': `Step ${i + 1} value`, value: s.rule.value ?? '', oninput: (e) => { s.rule.value = e.target.value; } }),
    h('button', { type: 'button', onclick: () => { f.steps.splice(i, 1); renderFunnelEditor(); } }, 'Remove')));
  $('#views').replaceChildren(h('div', { class: 'view' },
    h('label', { class: 'field' }, 'Funnel name', h('input', { value: f.name, oninput: (e) => { f.name = e.target.value; } })),
    h('small', { class: 'muted' }, 'Funnels are global and evaluated against the selected session.'),
    ...rows,
    h('p', {}, h('button', { type: 'button', onclick: () => { f.steps.push({ name: `Step ${f.steps.length + 1}`, rule: rule('event', '') }); renderFunnelEditor(); } }, '+ Add step')),
    h('div', { class: 'controls' },
      h('button', { type: 'button', class: 'primary', onclick: () => { const i = S.funnels.findIndex((x) => x.id === f.id); S.funnels[i] = f; S.editingFunnel = null; toast('Funnel saved.'); renderFunnel(); } }, 'Save'),
      h('button', { type: 'button', onclick: () => { S.editingFunnel = null; renderFunnel(); } }, 'Cancel'))));
}

// Sessions
function renderSessions() {
  const views = $('#views');
  if (!S.sessions.length) { views.replaceChildren(empty('No saved recordings.', 'Recordings are stored locally in this browser profile until you delete them.')); return; }
  const cards = S.sessions.map((s) => {
    const isCur = s === S.current, active = s.status === 'recording' || s.status === 'paused';
    const hits = isCur ? S.events.length : s.hits;
    const dur = (s.stopped ?? Date.now()) - s.started;
    const name = S.renaming === s.id
      ? h('form', { onsubmit: (e) => { e.preventDefault(); s.name = e.target.elements.n.value.trim() || s.name; S.renaming = null; renderAll(); } },
          h('input', { name: 'n', value: s.name, 'aria-label': 'Recording name' }), ' ', h('button', { type: 'submit' }, 'Save'))
      : h('strong', {}, s.name, isCur ? ' (shown)' : '');
    return h('li', { class: 'card' }, name,
      h('span', { class: 'muted' }, `${{ recording: '● recording', paused: '❚❚ paused', stopped: '■ stopped' }[s.status]} · ${new Date(s.started).toLocaleString('en-GB', { timeZone: 'Europe/Berlin', dateStyle: 'short', timeStyle: 'short' })} · ${clock(dur)} · ${hits} hits · ${isCur ? new Set(S.events.map((e) => e.tab)).size : s.tabs} tabs`),
      h('div', { class: 'actions' },
        h('button', { type: 'button', onclick: () => openSession(s) }, 'Open'),
        h('button', { type: 'button', onclick: () => { S.renaming = s.id; renderSessions(); $('#views input[name="n"]')?.focus(); } }, 'Rename'),
        h('button', { type: 'button', onclick: () => exportSession(s, 'json') }, 'JSON'),
        h('button', { type: 'button', onclick: () => exportSession(s, 'csv') }, 'CSV'),
        h('button', { type: 'button', disabled: active, title: active ? 'Stop the recording before deleting it' : null, onclick: () => confirmDelete(s, hits) }, 'Delete')));
  });
  views.replaceChildren(h('div', { class: 'view' },
    h('p', { class: 'muted' }, 'Using 4.2 MB of browser storage. Recordings are kept until you delete them.'),
    h('ol', { class: 'list' }, cards)));
}
function openSession(s) {
  if (!s.hasData) { toast('Mock: no fixture data for this session.'); return; }
  if (S.current) S.current.events = S.events;
  S.current = s;
  S.events = s.events ?? S.events;
  S.status = s.status;
  setView('live');
}
function confirmDelete(s, hits) {
  const d = $('#confirm');
  $('#confirm-text').textContent = `Delete "${s.name}"? ${hits} hits are removed from this browser. This cannot be undone.`;
  $('#confirm-ok').onclick = () => {
    S.sessions = S.sessions.filter((x) => x !== s);
    if (S.current === s) { S.current = null; S.events = []; S.status = 'none'; }
    d.close(); toast(`Deleted "${s.name}".`); renderAll();
  };
  $('#confirm-cancel').onclick = () => d.close();
  d.showModal();
  $('#confirm-cancel').focus();
}
function exportSession(s, fmt) {
  if (s !== S.current || !s.hasData) { toast('Mock: export only for the shown session.'); return; }
  const strip = ({ req, ...e }) => ({ ...e, timestamp: new Date(e.ts).toISOString() });
  let text, type;
  if (fmt === 'json') {
    const reqs = [...new Set(S.events.map((e) => e.req))].map(({ tab, ts, ...r }) => ({ ...r, tab_id: tab, timestamp: new Date(ts).toISOString() }));
    text = JSON.stringify({ format: 'aajr-session', format_version: 1, exported_at: new Date().toISOString(), session: { session_id: s.id, name: s.name, status: s.status, started_at: new Date(s.started).toISOString(), stopped_at: s.stopped ? new Date(s.stopped).toISOString() : null }, tabs: TABS, navigations: s.id === 's1' ? NAVS : [], requests: reqs, events: S.events.map(strip) }, null, 2);
    type = 'application/json';
  } else {
    const cell = (v) => { let t = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); if (/^[=+\-@]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const cols = ['timestamp_iso', 'tab', 'source', 'hit_type', 'rsid', 'page_name', 'page_url', 'link_name', 'events', 'evars', 'props', 'products', 'parse_status', 'capture_id'];
    const rows = S.events.map((e) => [new Date(e.ts).toISOString(), TABS[e.tab].badge, e.source, e.hit_type, (e.rsid ?? []).join(','), e.page_name, e.page_url, e.link_name, e.events.map((x) => x.name).join(','), e.evars, e.props, e.products.map((p) => p.raw), e.parse_status, e.capture_id].map(cell).join(','));
    text = '﻿' + [cols.join(','), ...rows].join('\r\n');
    type = 'text/csv';
  }
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: `aajr-session-${s.name.replace(/\W+/g, '-').toLowerCase()}.${fmt}` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Settings
function renderSettings() {
  const st = S.settings;
  const err = h('span', { class: 'error', role: 'alert' });
  const custom = h('textarea', { id: 'custom', 'aria-describedby': 'custom-help' }, st.custom);
  const masking = h('textarea', { id: 'masking', 'aria-describedby': 'masking-help', placeholder: 'eVar12\nemail\nxdm.identityMap.*' }, st.masking);
  const raw = h('input', { type: 'checkbox', checked: st.retainRaw });
  $('#views').replaceChildren(h('form', { class: 'view', onsubmit: (e) => {
    e.preventDefault();
    const bad = custom.value.split('\n').map((l, i) => [l.trim(), i + 1]).filter(([l]) => l).find(([l]) => { try { new URLPattern(l); return false; } catch { return true; } });
    if (bad) { err.textContent = `Line ${bad[1]} is not a valid URL pattern, e.g. https://*.example.com/collect*`; custom.focus(); return; }
    err.textContent = '';
    Object.assign(st, { custom: custom.value, masking: masking.value, retainRaw: raw.checked });
    toast('Settings saved. They apply to new hits.');
  } },
    h('h3', {}, 'Detection'),
    h('ul', {}, h('li', {}, h('code', {}, '/b/ss/'), ' AppMeasurement'), h('li', {}, h('code', {}, '/ee/…/v1/interact|collect'), ' Web SDK')),
    h('div', { class: 'field' }, h('label', { for: 'custom' }, 'Custom tracking URL patterns'), custom, h('small', { id: 'custom-help' }, 'One URL pattern per line. Matching requests are kept even if they cannot be decoded.'), err),
    h('h3', {}, 'Privacy'),
    h('label', { class: 'field' }, h('span', {}, raw, ' Keep raw requests (URL, headers, body)')),
    h('div', { class: 'field' }, h('label', { for: 'masking' }, 'Mask these variables'), masking, h('small', { id: 'masking-help' }, 'One name or path per line. Values are replaced by [masked] before saving and cannot be restored. Empty by default.')),
    h('h3', {}, 'Permissions'),
    h('p', {}, S.permission === 'granted' ? 'All-sites access: granted.' : 'All-sites access: not granted yet. Chrome asks when you start a recording.'),
    h('h3', {}, 'Filter profiles'),
    h('ul', {}, PROFILES.map((p) => h('li', {}, h('strong', {}, p.name), h('br'), h('span', { class: 'muted mono' }, `include any: ${p.include.map(ruleText).join('; ') || 'all'}${p.exclude.length ? ` · exclude: ${p.exclude.map(ruleText).join('; ')}` : ''}`)))),
    h('div', { class: 'controls' }, h('button', { type: 'submit', class: 'primary' }, 'Save settings'))));
}

// ---------- inspector ----------
function openInspector(id, list) { S.lastFocus = id; S.selected = id; S.inspList = list ?? S.events.map((e) => e.event_id); renderAll(); $('#insp-back')?.focus(); }
function closeInspector() {
  const id = S.lastFocus; S.selected = null; renderAll();
  $(`#views .row[data-id="${id}"]`)?.focus();
}
function step(dir) {
  const i = S.inspList.indexOf(S.selected) + dir;
  if (i < 0 || i >= S.inspList.length) return;
  S.selected = S.lastFocus = S.inspList[i];
  renderInspector();
}
function valueNode(v) {
  if (v && typeof v === 'object') {
    return h('span', {}, h('code', {}, v.raw), ' → ',
      v.resolved != null ? [longText(v.resolved), h('span', { class: 'ref' }, ` (from ${v.ref})`)] : h('span', { class: 'unresolved' }, `not in hit (${v.ref} set server-side or missing)`));
  }
  if (v === '') return h('span', { class: 'muted' }, '(empty)');
  return longText(v);
}
function longText(v) {
  v = String(v);
  if (v.length <= 200) return h('span', {}, v);
  const span = h('span', {}, v.slice(0, 200) + '… ');
  span.append(h('button', { type: 'button', class: 'link', onclick: (e) => { span.textContent = v; e.stopPropagation(); } }, 'Show all'));
  return span;
}
const sortKeys = (o) => Object.keys(o).sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
function kv(obj, emptyText) {
  const keys = sortKeys(obj);
  if (!keys.length) return h('p', { class: 'muted' }, emptyText);
  return h('dl', { class: 'kv' }, keys.map((k) => [h('dt', {}, k), h('dd', {}, Array.isArray(obj[k]) ? obj[k].join(' | ') : valueNode(obj[k]))]));
}
function renderInspector() {
  const e = S.events.find((x) => x.event_id === S.selected);
  const i = S.inspList.indexOf(e.event_id);
  const tabs = ['overview', 'events', 'variables', 'products', ...(e.xdm ? ['xdm'] : []), 'raw'];
  if (!tabs.includes(S.inspTab)) S.inspTab = 'overview';
  const tabLabel = { overview: 'Overview', events: `Events (${e.events.length})`, variables: 'Variables', products: `Products (${e.products.length})`, xdm: 'XDM', raw: 'Raw' };
  const sub = h('div', { class: 'subtabs', role: 'tablist', 'aria-label': 'Hit details', onkeydown: (ev) => {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    const j = (tabs.indexOf(S.inspTab) + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
    S.inspTab = tabs[j]; renderInspector(); $(`#st-${tabs[j]}`).focus();
  } }, tabs.map((t) => h('button', { type: 'button', role: 'tab', id: 'st-' + t, 'aria-selected': String(t === S.inspTab), 'aria-controls': 'insp-body', tabindex: t === S.inspTab ? '0' : '-1', onclick: () => { S.inspTab = t; renderInspector(); $(`#st-${t}`).focus(); } }, tabLabel[t])));
  const notice = e.parse_status !== 'complete'
    ? h('div', { class: 'notice ' + e.parse_status, role: 'note' }, h('strong', {}, e.parse_status === 'partial' ? '⚠ Partially decoded' : '✗ Not decoded'), h('ul', {}, e.parse_messages.map((m) => h('li', {}, m))))
    : null;
  const src = { appmeasurement: 'AppMeasurement', websdk: 'Web SDK', unknown: 'Unknown' }[e.source];
  const tab = TABS[e.tab];
  const body = h('div', { class: 'insp-body', id: 'insp-body', role: 'tabpanel', 'aria-labelledby': 'st-' + S.inspTab, tabindex: '0' }, notice);
  const copy = (txt, what) => h('button', { type: 'button', onclick: () => navigator.clipboard?.writeText(txt).then(() => toast(`${what} copied.`), () => toast('Copy failed: clipboard not available.')) }, `Copy ${what}`);
  const na = (v) => v ?? h('span', { class: 'muted' }, 'not in hit');
  switch (S.inspTab) {
    case 'overview':
      body.append(h('dl', { class: 'kv' }, [
        ['Time', `${fmtTime(e.ts)} (${new Date(e.ts).toISOString()})`], ['Source', src], ['Method', `${e.request_method} · ${e.req.type}`],
        ['Hit type', e.event_type ? `${e.hit_type} (${e.event_type})` : e.hit_type],
        e.source === 'websdk' ? ['Datastream', na(e.datastream_id)] : ['RSID', e.rsid ? e.rsid.join(', ') : na(null)],
        ['Server', e.tracking_server], ['Page name', na(e.page_name)], ['Page URL', e.page_url ? longText(e.page_url) : na(null)],
        ['Referrer', e.referrer ? longText(e.referrer) : na(null)], e.link_name ? ['Link name', e.link_name] : null,
        ['Tab', `${tab.badge} · ${tab.title}`], ['Capture', e.capture_method], ['Parse status', e.parse_status],
      ].filter(Boolean).map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])), h('p', {}, copy(JSON.stringify((({ req, ...x }) => x)(e), null, 2), 'JSON')));
      break;
    case 'events':
      body.append(e.events.length ? h('dl', { class: 'kv' }, e.events.map((x) => [h('dt', {}, x.name), h('dd', {}, x.value != null ? `value ${x.value}` : '', x.serial != null ? ` serial ${x.serial}` : '', x.value == null && x.serial == null ? h('span', { class: 'muted' }, 'counter') : '')])) : h('p', { class: 'muted' }, 'No events in this hit.'));
      break;
    case 'variables':
      body.append(h('h3', {}, `eVars (${Object.keys(e.evars).length})`), kv(e.evars, 'No eVars.'),
        h('h3', {}, `Props (${Object.keys(e.props).length})`), kv(e.props, 'No props.'),
        h('h3', {}, 'List variables'), kv(e.list_vars, 'None.'),
        h('h3', {}, 'Context data'), kv(e.context_data, e.source === 'websdk' ? 'Not used by the Web SDK; see XDM.' : 'None.'),
        h('h3', {}, 'Visitor IDs'), kv(e.visitor_ids, 'None in this hit.'),
        h('h3', {}, 'Other parameters'), kv(e.other_params, 'None.'));
      break;
    case 'products':
      body.append(e.products.length ? h('div', {}, e.products.map((p, j) => h('div', { class: 'card' },
        h('strong', {}, `${j + 1}. ${p.product ?? '(no product id)'}`),
        h('dl', { class: 'kv' }, [['Category', na(p.category)], ['Quantity', na(p.quantity)], ['Price', na(p.price)]].map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
        h('h3', {}, 'Product events'), kv(p.events, 'None.'), h('h3', {}, 'Merchandising eVars'), kv(p.evars, 'None.'),
        h('h3', {}, 'Raw'), h('pre', { class: 'wrap' }, p.raw)))) : h('p', { class: 'muted' }, e.source === 'websdk' && e.xdm?.productListItems ? 'No AA products string. XDM productListItems are in the XDM tab (not merged).' : 'No products in this hit.'));
      break;
    case 'xdm':
      body.append(h('p', { class: 'muted' }, 'Original XDM, not merged into Analytics variables (mapping happens in the datastream).'), h('pre', {}, JSON.stringify(e.xdm, null, 2)));
      break;
    case 'raw': {
      const r = e.req, u = new URL(r.url);
      body.append(h('dl', { class: 'kv' }, [['Method', r.method], ['Type', r.type], ['Capture', r.capture_method], ['Result', String(r.result.status_code)], ['Parse status', e.parse_status], ['Capture ID', r.capture_id]].map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
        h('h3', {}, 'URL'), h('pre', { class: 'wrap' }, r.url), h('p', {}, copy(r.url, 'URL')),
        u.search ? [h('h3', {}, 'Query parameters (in order)'), h('pre', {}, [...u.searchParams].map(([k, v]) => `${k}=${v}`).join('\n'))] : null,
        h('h3', {}, 'Headers available to the extension'), h('dl', { class: 'kv' }, r.headers.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
        h('p', { class: 'muted' }, 'Cookie and authorization headers are never captured.'),
        h('h3', {}, 'Body'),
        !r.body ? h('p', { class: 'muted' }, `No body (${r.method}).`)
          : r.body.kind === 'unavailable' ? h('p', { class: 'unresolved' }, 'Body not exposed by the browser for this request.')
          : [h('p', { class: 'muted' }, r.body.content_type), h('pre', {}, (() => { try { return JSON.stringify(JSON.parse(r.body.data), null, 2); } catch { return r.body.data; } })())]);
      break;
    }
  }
  $('#inspector').replaceChildren(
    h('div', { class: 'insp-head' },
      h('div', { class: 'insp-nav' },
        h('button', { type: 'button', id: 'insp-back', onclick: closeInspector }, '← Back'),
        h('button', { type: 'button', 'aria-label': 'Previous hit', disabled: i <= 0, onclick: () => step(-1) }, '↑ Prev'),
        h('button', { type: 'button', 'aria-label': 'Next hit', disabled: i >= S.inspList.length - 1, onclick: () => step(1) }, '↓ Next'),
        h('h2', { id: 'insp-title' }, `Hit ${i + 1} of ${S.inspList.length}`)),
      h('span', {}, `${fmtTime(e.ts)} · ${tab.badge} · ${e.request_method} · ${src}`),
      h('strong', {}, e.hit_type.startsWith('link') && e.link_name ? `link: ${e.link_name}` : e.page_name ?? '(no page name)')),
    sub, body);
}

// ---------- misc ----------
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function simulateHit() {
  if (S.status !== 'recording') { toast(S.status === 'paused' ? 'Paused: new requests are not recorded.' : 'Not recording: requests are ignored.'); return; }
  const last = S.events.at(-1)?.ts ?? Date.now();
  const ts = last + 4000 + Math.round(Math.random() * 9000);
  const req = S.events.length % 2
    ? amReq(ts, 't2', (p) => { p.set('pe', 'lnk_o'); p.set('pev2', 'Job: Merken'); p.set('events', 'event8'); })
    : sdkReq(ts, 't1', crypto.randomUUID(), (x, a) => { x.eventType = 'web.webinteraction.linkClicks'; Object.assign(a, { linkName: 'Reiseverlauf öffnen', events: 'event41' }); delete a.products; });
  S.events.push(...ingest(req));
  $('#announce').textContent = `New hit. ${S.events.length} hits.`;
  renderHeader();
  if (!S.selected && !S.settingsOpen) ({ live: renderLiveList, journey: renderJourney, funnel: renderFunnel, sessions: renderSessions })[S.view]();
  if (S.view === 'live' && !S.selected && !$('#live-list')) renderLive();
}

$('#tabs').addEventListener('click', (e) => { const t = e.target.closest('[role="tab"]'); if (t) setView(t.dataset.view); });
$('#tabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const tabs = [...$('#tabs').querySelectorAll('[role="tab"]')];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  setView(n.dataset.view); n.focus();
});
$('#gear').addEventListener('click', () => { S.settingsOpen = !S.settingsOpen; S.selected = null; renderAll(); });
document.addEventListener('keydown', (e) => {
  if (S.selected == null || $('#confirm').open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeInspector(); }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (e.key === 'j') step(1);
  if (e.key === 'k') step(-1);
});
$('#scenario').addEventListener('change', (e) => applyScenario(e.target.value));
$('#width').addEventListener('change', (e) => $('#panel').style.setProperty('--w', e.target.value + 'px'));
$('#simulate').addEventListener('click', simulateHit);
applyScenario('recording');
</script>
